<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #ff00ff;
      --neon-cyan: #00ffff;
      --chrome-silver: linear-gradient(180deg, #ffffff 0%, #a0a0a0 45%, #404040 50%, #808080 55%, #e0e0e0 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050505;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
      color: white;
    }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Scanlines and Vignette overlay from Immersive Theme */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      z-index: 50;
    }
    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
      z-index: 30;
      pointer-events: none;
    }

    #overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40; /* Placed above vignette, but below scanlines */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem;
      pointer-events: none;
    }

    .system-label {
      color: var(--neon-pink);
      font-size: 0.75rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.35em;
      text-shadow: 0 0 8px rgba(255, 0, 255, 0.6);
      opacity: 0.75;
      text-transform: uppercase;
    }

    #center-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 90%;
      transform: translateY(-5%);
    }

    /* Immersive UI style Retro Chrome Display text */
    .demo-title {
      font-family: 'Arial Black', Gadget, 'Orbitron', sans-serif;
      font-size: 8vw;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin-bottom: 0.5rem;
      background: var(--chrome-silver);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.85)) drop-shadow(0 0 22px rgba(255, 0, 255, 0.55));
      transform: skewX(-5deg);
      animation: logoPulse 4s ease-in-out infinite;
      position: relative;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1) skewX(-5deg); filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.85)) drop-shadow(0 0 22px rgba(255, 0, 255, 0.55)); }
      50% { transform: scale(1.02) skewX(-5deg); filter: drop-shadow(0 0 16px rgba(0, 255, 255, 1)) drop-shadow(0 0 30px rgba(255, 0, 255, 0.8)); }
    }

    .sub-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1vw;
      color: var(--neon-cyan);
      letter-spacing: 0.5em;
      text-shadow: 0 0 10px var(--neon-cyan);
      opacity: 0.9;
      margin-top: 0.5rem;
      animation: flicker 2.5s infinite alternate;
    }

    @keyframes flicker {
      0%, 19.99%, 22%, 62.99%, 64%, 64.99%, 70%, 100% { opacity: 0.95; }
      20%, 21.99%, 63%, 63.99%, 65%, 69.99% { opacity: 0.35; }
    }

    /* Additional styled system status element for immersive theme */
    .system-status-detail {
      font-size: 0.7rem;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-pink);
      opacity: 0.65;
      letter-spacing: 0.3em;
      margin-top: 1rem;
      text-transform: uppercase;
    }

    #controls-bar {
      pointer-events: auto;
      display: flex;
      gap: 0.8rem;
      background: rgba(5, 5, 5, 0.85);
      padding: 0.5rem 1rem;
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 4px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
    }

    .control-btn {
      background: transparent;
      border: 1px solid transparent;
      outline: none;
      font-family: 'Share Tech Mono', monospace;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      text-transform: uppercase;
      border-radius: 3px;
    }

    .control-btn:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
      border-color: rgba(0, 255, 255, 0.25);
    }

    .control-btn.active {
      color: #fff;
      background: rgba(0, 255, 255, 0.15);
      border: 1px solid rgba(0, 255, 255, 0.65);
      text-shadow: 0 0 10px var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.25);
    }

    @media (max-width: 768px) {
      .demo-title { font-size: 11vw; }
      .sub-title { font-size: 2.5vw; letter-spacing: 0.25em; }
      .control-btn { font-size: 0.8rem; padding: 0.5rem; min-height: 44px; display: flex; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div id="canvas-container"><canvas id="demo-canvas"></canvas></div>
  <div id="overlay-container">
    <div class="system-label">SYS // 90S DEMOSCENE</div>
    <div id="center-logo">
      <h1 class="demo-title" id="domain-text">DOMAIN</h1>
      <p class="sub-title" id="effect-label">MODULE: LOAD</p>
      <div class="system-status-detail">CORE_ENGINE_V4.2 // BUFFER_ACTIVE // SYNC_ON</div>
    </div>
    <div id="controls-bar">
      <button class="control-btn" data-effect="fire">Fire</button>
      <button class="control-btn" data-effect="plasma">Plasma</button>
      <button class="control-btn" data-effect="tunnel">Tunnel</button>
      <button class="control-btn" data-effect="copper">Copper</button>
    </div>
  </div>

  <script>
    // Hostname detection & cleanup
    let domain = window.location.hostname || "local file";
    domain = domain.replace(/^./, (char) => char.toUpperCase());
    document.title = domain;
    document.getElementById('domain-text').textContent = domain;

    const canvas = document.getElementById('demo-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, currentEffect = 'plasma';

    // Random choice on load
    const fxList = ['fire', 'plasma', 'tunnel', 'copper'];
    currentEffect = fxList[Math.floor(Math.random() * fxList.length)];

    // Button interactions
    const buttons = document.querySelectorAll('.control-btn');
    buttons.forEach(b => b.addEventListener('click', () => switchEffect(b.dataset.effect)));

    function switchEffect(name) {
      currentEffect = name;
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.effect === name));
      document.getElementById('effect-label').textContent = `ACTIVE MODULE: ${name.toUpperCase()}`;
      initEffect();
    }

    // --- EFFECT A: RETRO FIRE ---
    const fw = 160, fh = 120;
    const fireCanvas = document.createElement('canvas');
    const fireCtx = fireCanvas.getContext('2d');
    let fireImgData, firePixels = new Uint8Array(fw * fh), firePal = [];

    function initFire() {
      fireCanvas.width = fw; fireCanvas.height = fh;
      fireImgData = fireCtx.createImageData(fw, fh);
      firePixels.fill(0); firePal = [];
      const cp = [
        { p: 0.0, r: 0,   g: 0,   b: 0 },
        { p: 0.15, r: 16,  g: 4,   b: 0 },
        { p: 0.35, r: 180, g: 0,   b: 0 },
        { p: 0.55, r: 255, g: 110, b: 0 },
        { p: 0.75, r: 255, g: 210, b: 0 },
        { p: 0.90, r: 255, g: 255, b: 140 },
        { p: 1.0, r: 255, g: 255, b: 255 }
      ];
      for (let i = 0; i < 36; i++) {
        let t = i / 35, st = cp[0], ed = cp[cp.length - 1];
        for (let j = 0; j < cp.length - 1; j++) {
          if (t >= cp[j].p && t <= cp[j+1].p) { st = cp[j]; ed = cp[j+1]; break; }
        }
        let lt = (t - st.p) / (ed.p - st.p);
        firePal.push({
          r: Math.floor(st.r + (ed.r - st.r) * lt),
          g: Math.floor(st.g + (ed.g - st.g) * lt),
          b: Math.floor(st.b + (ed.b - st.b) * lt)
        });
      }
    }

    function renderFire() {
      for (let x = 0; x < fw; x++) {
        firePixels[(fh - 1) * fw + x] = Math.random() > 0.18 ? 35 : 0;
        firePixels[(fh - 2) * fw + x] = Math.random() > 0.18 ? 35 : 0;
      }
      for (let x = 0; x < fw; x++) {
        for (let y = 1; y < fh; y++) {
          let src = y * fw + x, pixel = firePixels[src];
          if (pixel === 0) firePixels[src - fw] = 0;
          else {
            let rnd = Math.floor(Math.random() * 3), dec = Math.floor(Math.random() * 2.1);
            let dst = src - fw - rnd + 1;
            if (dst >= 0 && dst < fw * fh) firePixels[dst] = Math.max(0, pixel - dec);
          }
        }
      }
      const data = fireImgData.data; let idx = 0;
      for (let i = 0; i < fw * fh; i++) {
        let c = firePal[firePixels[i]];
        data[idx] = c.r; data[idx+1] = c.g; data[idx+2] = c.b; data[idx+3] = 255; idx += 4;
      }
      fireCtx.putImageData(fireImgData, 0, 0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(fireCanvas, 0, 0, width, height);
    }

    // --- EFFECT B: PLASMA ---
    const pw = 160, ph = 120;
    const plasCanvas = document.createElement('canvas');
    const plasCtx = plasCanvas.getContext('2d');
    let plasImgData, plasPal = [];

    function initPlasma() {
      plasCanvas.width = pw; plasCanvas.height = ph;
      plasImgData = plasCtx.createImageData(pw, ph);
      plasPal = [];
      for (let i = 0; i < 256; i++) {
        plasPal.push({
          r: Math.floor(128 + 127 * Math.sin(i * Math.PI / 128)),
          g: Math.floor(128 + 127 * Math.sin(i * Math.PI / 128 + 2.094)),
          b: Math.floor(128 + 127 * Math.sin(i * Math.PI / 128 + 4.188))
        });
      }
    }

    function renderPlasma(time) {
      const data = plasImgData.data; let idx = 0; const t = time * 0.0015;
      for (let y = 0; y < ph; y++) {
        for (let x = 0; x < pw; x++) {
          let v1 = Math.sin(x * 0.025 + t * 2.0);
          let v2 = Math.sin(0.02 * (x * Math.sin(t * 0.5) + y * Math.cos(t * 0.7)) + t * 1.5);
          let cx = x - pw/2 + (pw/3) * Math.sin(t * 0.8), cy = y - ph/2 + (ph/3) * Math.cos(t * 0.6);
          let v3 = Math.sin(Math.sqrt(cx*cx + cy*cy) * 0.04 + t);
          let v = (v1 + v2 + v3) / 3;
          let colIdx = Math.floor((v + 1.0) * 127.5) & 255;
          let c = plasPal[colIdx];
          data[idx] = c.r; data[idx+1] = c.g; data[idx+2] = c.b; data[idx+3] = 255; idx += 4;
        }
      }
      plasCtx.putImageData(plasImgData, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(plasCanvas, 0, 0, width, height);
    }

    // --- EFFECT C: 3D TUNNEL ---
    let rings = [], stars = [];
    const numRings = 24, numStars = 120;

    function initTunnel() {
      rings = []; stars = [];
      for (let i = 0; i < numRings; i++) rings.push({ z: (i / numRings) * 1000, hue: (i / numRings) * 360 });
      for (let i = 0; i < numStars; i++) stars.push({ x: (Math.random()-0.5)*1000, y: (Math.random()-0.5)*1000, z: Math.random()*1000 });
    }

    function renderTunnel(time) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, 0, width, height);
      const cx = width / 2, cy = height / 2, fov = 300, t = time * 0.001;
      const getCenter = (z) => ({
        x: Math.sin(z * 0.0035 + t * 1.5) * 80,
        y: Math.cos(z * 0.0028 + t * 1.8) * 60
      });

      ctx.fillStyle = '#fff';
      stars.forEach(s => {
        s.z -= 9; if (s.z <= 0) { s.z = 1000; s.x = (Math.random()-0.5)*1000; s.y = (Math.random()-0.5)*1000; }
        let tc = getCenter(s.z), sx = cx + ((s.x + tc.x) / s.z) * fov, sy = cy + ((s.y + tc.y) / s.z) * fov;
        if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
          let size = (1.0 - s.z / 1000) * 3 + 0.5;
          ctx.fillRect(sx, sy, size, size);
        }
      });

      rings.forEach((r, idx) => {
        r.z -= 6; if (r.z <= 0) { r.z = 1000; r.hue = (r.hue + 45) % 360; }
        let z = r.z; let alpha = 1.0;
        if (z > 800) alpha = (1000 - z) / 200;
        if (z < 150) alpha = (z - 50) / 100;
        if (alpha <= 0) return;

        let tc = getCenter(z), rad = 150, sides = 8, rot = t * 0.5 + z * 0.001;
        ctx.strokeStyle = `hsla(${r.hue}, 100%, 60%, ${alpha})`;
        ctx.lineWidth = Math.max(1, (1.0 - z / 1000) * 4);
        ctx.beginPath();
        for (let s = 0; s <= sides; s++) {
          let a = (s / sides) * Math.PI * 2 + rot;
          let px = cx + ((rad * Math.cos(a) + tc.x) / z) * fov;
          let py = cy + ((rad * Math.sin(a) + tc.y) / z) * fov;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        if (idx < numRings - 1) {
          let next = rings[(idx+1)%numRings], nz = next.z, ntc = getCenter(nz), nrot = t * 0.5 + nz * 0.001;
          ctx.strokeStyle = `hsla(${r.hue}, 100%, 50%, ${alpha * 0.2})`; ctx.lineWidth = 1;
          for (let s = 0; s < 4; s++) {
            let a = (s / 4) * Math.PI * 2 + rot, px = cx + ((rad * Math.cos(a) + tc.x) / z) * fov, py = cy + ((rad * Math.sin(a) + tc.y) / z) * fov;
            let na = (s / 4) * Math.PI * 2 + nrot, npx = cx + ((rad * Math.cos(na) + ntc.x) / nz) * fov, npy = cy + ((rad * Math.sin(na) + ntc.y) / nz) * fov;
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(npx, npy); ctx.stroke();
          }
        }
      });
    }

    // --- EFFECT D: COPPER BARS ---
    let copperBars = [];
    function initCopper() {
      copperBars = [];
      for (let i = 0; i < 10; i++) {
        copperBars.push({
          phase: (i / 10) * Math.PI * 2, speed: 1.3 + (i % 3) * 0.4, thickness: 45 + (i % 2) * 20,
          r: (i % 3 === 0) ? 255 : (i % 3 === 1 ? 0 : 255),
          g: (i % 3 === 0) ? 0 : (i % 3 === 1 ? 255 : 0),
          b: (i % 3 === 0) ? 255 : (i % 3 === 1 ? 255 : 0),
          direction: (i % 2 === 0) ? 'horizontal' : 'diagonal'
        });
      }
    }

    function renderCopper(time) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height); const t = time * 0.0015;
      copperBars.forEach(bar => {
        let bounce = Math.sin(t * bar.speed + bar.phase), ht = bar.thickness / 2;
        if (bar.direction === 'horizontal') {
          let cy = (height / 2) + bounce * (height / 2.3);
          for (let i = -ht; i <= ht; i++) {
            let ly = Math.floor(cy + i); if (ly < 0 || ly >= height) continue;
            let intens = Math.cos((i / ht) * (Math.PI / 2)); if (intens < 0) intens = 0;
            let wave = Math.sin(ly * 0.004 + t * 4) * 80;
            ctx.strokeStyle = `rgba(${Math.floor(bar.r*intens)},${Math.floor(bar.g*intens)},${Math.floor(bar.b*intens)},0.85)`;
            ctx.lineWidth = 1; ctx.beginPath();
            ctx.moveTo(0, ly + Math.sin((wave) * 0.004) * 25);
            ctx.lineTo(width, ly + Math.sin((width + wave) * 0.004) * 25);
            ctx.stroke();
          }
        } else {
          let cx = (width / 2) + bounce * (width / 2.3);
          for (let i = -ht; i <= ht; i++) {
            let lx = Math.floor(cx + i); if (lx < -200 || lx >= width + 200) continue;
            let intens = Math.cos((i / ht) * (Math.PI / 2)); if (intens < 0) intens = 0;
            let wave = Math.sin(lx * 0.004 + t * 3) * 80;
            ctx.strokeStyle = `rgba(${Math.floor(bar.r*intens)},${Math.floor(bar.g*intens)},${Math.floor(bar.b*intens)},0.35)`;
            ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.moveTo(lx + wave, 0); ctx.lineTo(lx - wave, height); ctx.stroke();
          }
        }
      });
    }

    // --- LIFE CYCLE & MAIN LOOP ---
    function initEffect() {
      if (currentEffect === 'fire') initFire();
      else if (currentEffect === 'plasma') initPlasma();
      else if (currentEffect === 'tunnel') initTunnel();
      else if (currentEffect === 'copper') initCopper();
    }

    function resize() {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
      initEffect();
    }

    window.addEventListener('resize', resize);
    resize();
    switchEffect(currentEffect);

    function loop(time) {
      if (currentEffect === 'fire') renderFire(time);
      else if (currentEffect === 'plasma') renderPlasma(time);
      else if (currentEffect === 'tunnel') renderTunnel(time);
      else if (currentEffect === 'copper') renderCopper(time);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
